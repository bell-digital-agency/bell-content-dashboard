<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bell — Jadwal Upload</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bell Jadwal">
<meta name="theme-color" content="#E8A33D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F2ECDD;
    --dot: rgba(26,26,26,.055);
    --ink: #1a1a1a;
    --card: #fffdf6;
    --border: #1a1a1a;
    --text: #1a1a1a;
    --muted: #6b6558;
    --accent: #E8A33D;
    --accent-ink: #1a1a1a;
    --border-w: 2.5px;
    --radius: 16px;
    --shadow: none;
    --st0-bg:#C7D9B4; --st0-fg:#1f3a12;
    --st1-bg:#BFD3E0; --st1-fg:#10324a;
    --st2-bg:#F2D27C; --st2-fg:#4a3406;
    --st3-bg:#EFB2A6; --st3-fg:#5c1a10;
    --st4-bg:#E7E1CF; --st4-fg:#4a4432;
    --st9-bg:#E3E0D6; --st9-fg:#555;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #171510;
    --dot: rgba(244,239,225,.10);
    --ink: #F4EFE1;
    --card: #211e16;
    --border: #F4EFE1;
    --text: #F4EFE1;
    --muted: #a49c87;
    --accent: #E8A33D;
    --accent-ink: #1a1a1a;
    --st0-bg:#2c3b20; --st0-fg:#c7d9b4;
    --st1-bg:#1c3042; --st1-fg:#bfd3e0;
    --st2-bg:#4a3c17; --st2-fg:#f2d27c;
    --st3-bg:#4a241d; --st3-fg:#efb2a6;
    --st4-bg:#33301f; --st4-fg:#d8d2bb;
    --st9-bg:#2a271e; --st9-fg:#a49c87;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size: 18px 18px;
    color: var(--text);
    font: 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    min-height: 100vh;
    transition: background-color .15s, color .15s;
  }
  h1,h2,h3, .brand, .daylabel, .judul, .client span, .flabel, .pill, button, .epbtn, .stamp {
    font-family: "Space Grotesk", "Inter", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 48px; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: var(--border-w) solid var(--border);
  }
  header .inner { max-width: 680px; margin: 0 auto; padding: 14px 16px; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand {
    font-weight: 700; letter-spacing: .01em; font-size: 17px; color: var(--ink);
    text-transform: uppercase; display: flex; align-items: baseline; gap: 7px;
  }
  .brand span {
    background: var(--accent); color: var(--accent-ink);
    border: var(--border-w) solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; letter-spacing: .03em;
  }
  .themebtn {
    width: 36px; height: 36px; border-radius: 10px;
    border: var(--border-w) solid var(--border); cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    background: var(--ink); color: var(--bg);
  }
  :root[data-theme="dark"] .themebtn { background: var(--text); color: var(--bg); }
  .themebtn svg { width: 18px; height: 18px; stroke: currentColor; }
  .themebtn .i-sun { display: none; }
  :root[data-theme="dark"] .themebtn .i-moon { display: none; }
  :root[data-theme="dark"] .themebtn .i-sun { display: block; }
  .themebtn:active { transform: translateY(1px); }
  .datebar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .datebar input[type=date] {
    flex: 1; min-width: 0; background: var(--card); color: var(--text);
    border: var(--border-w) solid var(--border); border-radius: 10px; padding: 9px 10px;
    font: 600 14px "Inter", sans-serif; color-scheme: inherit;
  }
  .datebar button {
    background: var(--card); color: var(--ink); border: var(--border-w) solid var(--border);
    border-radius: 10px; padding: 9px 13px; font: 600 14px "Space Grotesk", sans-serif; cursor: pointer;
    min-width: 44px; min-height: 40px;
  }
  .datebar button:active { transform: translateY(1px); }
  #today { background: var(--accent); border-color: var(--border); color: var(--accent-ink); font-weight: 700; }
  .daylabel { margin: 20px 0 6px; font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: .01em; }
  .summaryrow { display: flex; justify-content: space-between; align-items: baseline;
                gap: 10px; margin: 0 0 16px; }
  #summary { color: var(--muted); font-size: 13px; margin: 0; font-weight: 500; }
  #lastupd { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .client {
    margin: 22px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: var(--border-w) solid var(--border); border-radius: 12px;
    padding: 9px 14px; background: var(--client-color, var(--accent));
  }
  .client span {
    font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--client-ink, var(--accent-ink));
  }
  .epbtn {
    font-size: 11.5px; font-weight: 700; letter-spacing: .01em; text-transform: none;
    color: var(--client-ink, var(--accent-ink)); border: 1.5px solid var(--client-ink, var(--accent-ink));
    border-radius: 999px; padding: 3px 10px; text-decoration: none; white-space: nowrap;
    background: rgba(255,255,255,.28); display: inline-flex; align-items: center; gap: 4px;
  }
  .epbtn svg { width: 12px; height: 12px; stroke: currentColor; flex-shrink: 0; }
  .card {
    background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius);
    padding: 15px; margin-bottom: 14px;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    border: 1.5px solid var(--border); color: var(--text); text-transform: uppercase; letter-spacing: .02em;
  }
  .pill.platform { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .st-0 { background: var(--st0-bg); color: var(--st0-fg); border-color: var(--st0-fg); }
  .st-1 { background: var(--st1-bg); color: var(--st1-fg); border-color: var(--st1-fg); }
  .st-2 { background: var(--st2-bg); color: var(--st2-fg); border-color: var(--st2-fg); }
  .st-3 { background: var(--st3-bg); color: var(--st3-fg); border-color: var(--st3-fg); }
  .st-4 { background: var(--st4-bg); color: var(--st4-fg); border-color: var(--st4-fg); }
  .st-9 { background: var(--st9-bg); color: var(--st9-fg); border-color: var(--st9-fg); }
  .judul { font-weight: 700; font-size: 19px; line-height: 1.3; margin: 0 0 4px; }
  .field { margin-top: 13px; }
  .flabel {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .rawlink {
    color: var(--text); text-decoration: underline; text-decoration-color: var(--accent);
    text-decoration-thickness: 2px; font-size: 13px; font-family: "Inter", sans-serif;
    word-break: break-all; line-height: 1.5;
  }
  .filechip { font-size: 13px; color: var(--muted); word-break: break-all; line-height: 1.5; font-family: "Inter", sans-serif; }
  .captext {
    white-space: pre-wrap; word-break: break-word; font-size: 13.5px; font-family: "Inter", sans-serif;
    line-height: 1.6; color: var(--text);
  }
  .copy {
    background: var(--card); color: var(--text); border: 1.5px solid var(--border);
    border-radius: 999px; padding: 3px 11px; font: 700 11px "Space Grotesk", sans-serif;
    cursor: pointer; white-space: nowrap; text-transform: uppercase; letter-spacing: .02em;
  }
  .copy.ok { background: var(--st0-bg); color: var(--st0-fg); border-color: var(--st0-fg); }
  .empty { color: var(--muted); padding: 34px 16px; text-align: center; border: var(--border-w) dashed var(--border); border-radius: var(--radius); font-weight: 500; }
  .empty b { color: var(--text); }
  footer { color: var(--muted); font-size: 12px; margin-top: 30px; text-align: center; }
  #unsched { margin-top: 30px; }
  #unsched h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
</style>
</head>
<body>
<header><div class="inner">
  <div class="topline">
    <div class="brand">BELL<span>Jadwal Upload</span></div>
    <button class="themebtn" id="themebtn" aria-label="Ganti tema" title="Ganti tema">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
  <div class="datebar">
    <button id="prev" aria-label="sebelumnya">‹</button>
    <input type="date" id="pick">
    <button id="next" aria-label="berikutnya">›</button>
    <button id="today">Hari ini</button>
  </div>
</div></header>
<div class="wrap">
  <div class="daylabel" id="daylabel"></div>
  <div class="summaryrow"><div id="summary"></div><div id="lastupd"></div></div>
  <div id="list"></div>
  <div id="unsched"></div>
  <footer id="foot">memuat data…</footer>
</div>
<script>
"use strict";
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const $ = id => document.getElementById(id);

// --- tema terang/gelap ---
const THEME_KEY = "bell-dash-theme";
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(THEME_KEY, t);
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved || sys);
})();
$("themebtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(cur === "dark" ? "light" : "dark");
});

// --- warna per klien (brutalist palette, dipilih biar kontras & konsisten) ---
const CLIENT_PALETTE = [
  { bg: "#E8A33D", ink: "#1a1a1a" }, // mustard
  { bg: "#A3A86B", ink: "#1a1a1a" }, // olive
  { bg: "#D98B63", ink: "#1a1a1a" }, // terracotta
  { bg: "#8FB3C2", ink: "#1a1a1a" }, // dusty blue
  { bg: "#9FB37E", ink: "#1a1a1a" }, // sage
  { bg: "#C9A8D9", ink: "#1a1a1a" }, // plum
  { bg: "#E0C14A", ink: "#1a1a1a" }, // gold
  { bg: "#D99BA6", ink: "#1a1a1a" }, // dusty rose
  { bg: "#8FA3C2", ink: "#1a1a1a" }, // steel blue
];
const CLIENT_FIXED = {
  "QJMOTOR": CLIENT_PALETTE[0],
  "Giyanti Coffee": CLIENT_PALETTE[1],
  "Mikkro Coffee": CLIENT_PALETTE[2],
  "Marvel": CLIENT_PALETTE[3],
  "Honda NTB": CLIENT_PALETTE[8],
  "Honda Bali": CLIENT_PALETTE[8],
  "TikTok Astra": CLIENT_PALETTE[5],
  "Socmed Bell": CLIENT_PALETTE[4],
  "Borobudur Park": CLIENT_PALETTE[6],
  "Prambanan Park": CLIENT_PALETTE[7],
};
function clientColor(name) {
  if (CLIENT_FIXED[name]) return CLIENT_FIXED[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CLIENT_PALETTE[h % CLIENT_PALETTE.length];
}

function wibISO(d) {
  const t = new Date(d.getTime() + 7 * 3600e3); // geser ke WIB lalu ambil komponen UTC
  return t.toISOString().slice(0, 10);
}
function shiftISO(iso, delta) {
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0, 10);
}
function fmtHari(iso) {
  const d = new Date(iso + "T12:00:00Z");
  return HARI[d.getUTCDay()] + ", " + d.getUTCDate() + " " + BULAN[d.getUTCMonth()] + " " + d.getUTCFullYear();
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function stClass(status) {
  const s = (status || "").toLowerCase();
  if (s.includes("uploaded") || s.includes("scheduled")) return "st-0";
  if (s.includes("ready") || s.includes("approved")) return "st-1";
  if (s.includes("preview") || s.includes("acc")) return "st-2";
  if (s.includes("revision")) return "st-3";
  if (s.includes("production") || s.includes("asset ready")) return "st-4";
  return "st-9";
}
function extractLinks(cell) {
  const urls = String(cell || "").match(/https?:\/\/[^\s"'<>]+/g) || [];
  const txt = String(cell || "").trim();
  return { urls, text: txt };
}

let DATA = null;
let current = wibISO(new Date());

function fieldLinks(cell, label) {
  const { urls, text } = extractLinks(cell);
  let body;
  if (urls.length) {
    body = urls.map(u =>
      `<div><a class="rawlink" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`
    ).join("");
  } else if (text) {
    body = `<div class="filechip">${esc(text)}</div>`;
  } else {
    body = `<div class="filechip">—</div>`;
  }
  const copyVal = urls.join("\n") || text || "";
  const copyBtn = copyVal
    ? `<button class="copy" data-copy="${esc(JSON.stringify(copyVal))}">Salin</button>` : "";
  return `<div class="field"><div class="flabel">${esc(label)} ${copyBtn}</div>${body}</div>`;
}

const EXTLINK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>`;
function epBtn(k) {
  const u = DATA && DATA.clients && DATA.clients[k];
  return u ? `<a class="epbtn" href="${esc(u)}" target="_blank" rel="noopener">Buka EP ${EXTLINK_SVG}</a>` : "";
}

function clientHeader(k) {
  const c = clientColor(k);
  return `<div class="client" style="--client-color:${c.bg};--client-ink:${c.ink}"><span>${esc(k)}</span>${epBtn(k)}</div>`;
}

function render() {
  const items = DATA.items.filter(i => i.tanggal === current);
  $("daylabel").textContent = fmtHari(current);
  $("pick").value = current;

  const klien = new Set(items.map(i => i.klien));
  $("summary").textContent = items.length
    ? items.length + " konten · " + klien.size + " klien"
    : "Tidak ada konten terjadwal di tanggal ini";

  const groups = {};
  for (const it of items) (groups[it.klien] = groups[it.klien] || []).push(it);

  let h = "";
  for (const k of Object.keys(groups)) {
    h += clientHeader(k);
    for (const it of groups[k]) {
      h += `<div class="card">`;
      h += `<div class="pills">`;
      h += `<span class="pill platform">${esc(it.platform || "—")}</span>`;
      if (it.tipe) h += `<span class="pill">${esc(it.tipe)}</span>`;
      h += `<span class="pill ${stClass(it.status)}">${esc(it.status || "belum ada status")}</span>`;
      h += `</div>`;
      if (it.judul) h += `<p class="judul">${esc(it.judul)}</p>`;
      h += fieldLinks(it.link, "Link Content");
      if (it.cover) h += fieldLinks(it.cover, "Link Cover");
      const cap = (it.caption || "").trim();
      const capBtn = cap
        ? `<button class="copy" data-copy="${esc(JSON.stringify(it.caption))}">Salin</button>` : "";
      h += `<div class="field"><div class="flabel">Caption ${capBtn}</div>` +
           `<div class="captext">${cap ? esc(it.caption) : "—"}</div></div>`;
      h += `</div>`;
    }
  }
  $("list").innerHTML = h || `<div class="empty"><b>Tidak ada konten</b> untuk ${fmtHari(current)}.</div>`;

  // belum terjadwal — hanya di tampilan hari ini
  const uns = DATA.items.filter(i => !i.tanggal);
  if (current === wibISO(new Date()) && uns.length) {
    const by = {};
    for (const it of uns) (by[it.klien] = by[it.klien] || []).push(it);
    let uh = `<h3>Belum terjadwal (${uns.length})</h3>`;
    for (const k of Object.keys(by)) {
      uh += clientHeader(k);
      for (const it of by[k]) {
        uh += `<div class="card"><div class="pills">`;
        uh += `<span class="pill platform">${esc(it.platform || "—")}</span>`;
        if (it.tipe) uh += `<span class="pill">${esc(it.tipe)}</span>`;
        uh += `<span class="pill ${stClass(it.status)}">${esc(it.status || "belum ada status")}</span>`;
        uh += `</div>`;
        if (it.judul) uh += `<p class="judul">${esc(it.judul)}</p>`;
        uh += `</div>`;
      }
    }
    $("unsched").innerHTML = uh;
  } else {
    $("unsched").innerHTML = "";
  }
}

function relTime(g) {
  const s = Math.max(0, Math.floor((Date.now() - g.getTime()) / 1000));
  if (s < 60) return "baru saja";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " menit lalu";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " jam lalu";
  return Math.floor(h / 24) + " hari lalu";
}

async function init() {
  const r = await fetch("data.json", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  DATA = await r.json();
  const g = DATA.generated_at ? new Date(DATA.generated_at) : null;
  $("foot").textContent = g
    ? "Data diperbarui: " + g.toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB"
    : "Data diperbarui: —";
  $("lastupd").textContent = g ? "Update: " + relTime(g) : "Update: —";
  render();
}

$("pick").addEventListener("change", e => { current = e.target.value; render(); });
$("prev").addEventListener("click", () => { current = shiftISO(current, -1); render(); });
$("next").addEventListener("click", () => { current = shiftISO(current, 1); render(); });
$("today").addEventListener("click", () => { current = wibISO(new Date()); render(); });

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const t = JSON.parse(btn.dataset.copy);
  const ok = await copyText(t);
  const old = btn.textContent;
  btn.textContent = ok ? "✓ Tersalin" : "Gagal";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1600);
});

init().catch(err => {
  $("list").innerHTML = `<div class="empty">Gagal memuat data (${esc(err.message)}).<br>Coba muat ulang halaman.</div>`;
});
</script>
</body>
</html>
